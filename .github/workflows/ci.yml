name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PSExecutionPolicyPreference: RemoteSigned

jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (startsWith(matrix.os, 'ubuntu-') && fromJSON('["self-hosted","Linux","X64","personal-ci"]') || startsWith(matrix.os, 'windows-') && fromJSON('["self-hosted","Windows","X64","personal-ci"]') || matrix.os) || matrix.os }}
    steps:
      - name: Isolate personal Linux Rust toolchains
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          tools="$(dirname "$RUNNER_TEMP")/_tool"
          echo "CARGO_HOME=$tools/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tools/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "$tools/cargo/bin" >> "$GITHUB_PATH"
      - name: Set up personal Windows build tools
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $paths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\cmd', 'C:\Program Files\PowerShell\7', 'C:\Program Files\GitHub CLI', 'C:\Program Files\7-Zip', 'C:\msys64\ucrt64\bin')
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vs) { $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"; $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" }
          }
          $paths | Where-Object { Test-Path $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'AGENT_TOOLSDIRECTORY=C:\personal-ci\toolcache' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'DOTNET_INSTALL_DIR=C:\personal-ci\toolcache\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tools = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) '_tool'
          "CARGO_HOME=$tools\cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$tools\rustup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$tools\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential file
      - name: Install Node required by pnpm bootstrap
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high
      - name: Install Rust advisory scanner
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - run: pnpm verify
      - name: Compile the host desktop binary
        run: pnpm tauri build --ci --no-bundle -- --locked
