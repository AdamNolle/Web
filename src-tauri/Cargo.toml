[package]
name = "web-social-digest"
version = "0.1.0"
description = "A calm local-first social digest"
authors = ["Web contributors"]
edition = "2024"
rust-version = "1.96"

[lib]
name = "web_social_digest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
httpdate = "1.0.3"
feed-rs = "2.3.1"
futures-util = "0.3.31"
keyring = "4.1.5"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
zeroize = "1.8.2"

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
